name: CodeQL

# Code scanning: looks for security bugs (injection, unsafe deserialization, path
# traversal, weak crypto) in the Java code and in these workflows. Findings appear under
# Security > Code scanning; a new one on a pull request shows as a failed check there.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so new queries run over code that hasn't changed
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # Java without a build (CodeQL reads the sources and the Maven dependencies);
        # actions covers the workflows in .github/workflows
        language: [java-kotlin, actions]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        if: ${{ matrix.language == 'java-kotlin' }}
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended

      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
