name: CI

# Pull requests run from their branch; pushes only from main, so a branch with an
# open pull request isn't built twice
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to a pull request cancels its run in progress. Runs on main are never
# cancelled, so every commit there gets a result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # Actions are pinned to commit SHAs, which can't be moved like tags; Dependabot
      # updates the SHA and the version comment together
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history, so the migration check can diff against the base commit
          fetch-depth: 0

      - name: Applied migrations are unchanged
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: scripts/check-migrations.sh "$BASE"

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: Unit tests
        run: ./mvnw -B -ntp test

      # Testcontainers uses the Docker engine on GitHub-hosted runners.
      # Unit tests already ran; their coverage data is still in target/jacoco.exec,
      # so the report and the coverage floor cover both kinds of test.
      - name: Integration tests, coverage report and floor
        run: ./mvnw -B -ntp verify -DskipUnitTests

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jacoco-report
          path: target/site/jacoco/
          if-no-files-found: ignore

      - name: Upload test reports on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          if-no-files-found: ignore

      # Builds the image, starts it with Postgres and Redis using the prod
      # profile, and runs the smoke checks against it over HTTP
      - name: Build Docker image and smoke test it
        run: |
          scripts/init-env.sh
          docker compose up -d --build --wait
          scripts/smoke.sh

      # The image the smoke test just ran; fails on a high or critical vulnerability
      # with a fix (settings and accepted ones in .grype.yaml)
      - name: Scan the Docker image
        run: scripts/scan-image.sh

      - name: App logs on failure
        if: ${{ failure() }}
        run: docker compose logs app

  # Every commit on main that passed the build, tests, smoke test and scan is published
  # to GHCR, tagged with its SHA, with an SBOM and build provenance attached to the image
  # as attestations. It's built again here from the same commit with Buildx, which the
  # attestations need; pull requests never publish.
  publish:
    needs: build
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the image with SBOM and provenance
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max
