# Database and Redis connections come from Testcontainers (@ServiceConnection),
# so nothing here points at a real host.
spring:
  main:
    banner-mode: off
  # Every cached test context keeps its own pool; by default each holds 10 connections even
  # when idle. Keep 2 idle and grow to the usual 10 under load (the race tests need them)
  datasource:
    hikari:
      minimum-idle: 2

roomkeeper:
  auth:
    # Test-only secret
    jwt-secret: Ppkmwuhp1b/rqHAnF96nUxXtny03ZgOBUh3NbcEk7yk=
  # Test-only admin; AbstractIntegrationTest logs in as it to approve hotels
  admin:
    email: admin@roomkeeper.test
    password: test-admin-password

  # Tests run the scheduled jobs themselves, at the time they choose
  jobs:
    enabled: false

  # ...and deliver outbox events themselves (AbstractIntegrationTest.deliverOutbox);
  # OutboxStreamLiveIT turns this on
  outbox:
    live-delivery: false

  # Tests pay through FakePaymentGateway, not Stripe, and sign webhooks with this test-only secret
  payments:
    stripe:
      webhook-secret: whsec_roomkeeper_test

logging:
  level:
    org.testcontainers: WARN
    tc: WARN
