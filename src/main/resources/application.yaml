spring:
  application:
    name: roomkeeper
  profiles:
    # Profiles: local (developer machine), test (test suite), prod (deployed)
    default: local
  jpa:
    # Flyway owns the schema; Hibernate only checks that entities match it
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

roomkeeper:
  auth:
    issuer: roomkeeper
    access-token-ttl: 15m
    refresh-token-ttl: 7d
    # jwt-secret is set per profile; prod reads it from JWT_SECRET
  rate-limits:
    login:
      capacity: 10
      period: 1m

management:
  endpoints:
    web:
      exposure:
        include: health, info
