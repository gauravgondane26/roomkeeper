spring:
  application:
    name: roomkeeper
  profiles:
    # Profiles: local (developer machine), test (test suite), prod (deployed)
    default: local
  jpa:
    # Flyway owns the schema; Hibernate only checks that entities match it
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

management:
  endpoints:
    web:
      exposure:
        include: health, info
