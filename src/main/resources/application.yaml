server:
  # Behind a reverse proxy, the client's address comes from X-Forwarded-For, but only when the
  # request came from a proxy matching TRUSTED_PROXIES (a regex of IP addresses, such as
  # 10\.0\.0\.\d+); the address taken is the last one that proxy added. Empty, the default,
  # trusts no one: otherwise any client could claim a new address on every request and never
  # be rate limited. (Tomcat on its own would trust every private-network address.)
  forward-headers-strategy: native
  tomcat:
    remoteip:
      internal-proxies: ${TRUSTED_PROXIES:}

spring:
  application:
    name: roomkeeper
  # VIRTUAL_THREADS=true serves requests (and Spring's own async and scheduling) on virtual
  # threads instead of Tomcat's 200 platform threads (docs/virtual-threads-benchmark.md)
  threads:
    virtual:
      enabled: ${VIRTUAL_THREADS:false}
  profiles:
    # Profiles: local (developer machine), test (test suite), prod (deployed)
    default: local
  # How long to wait on a store that stops answering (a network partition, a paused or
  # overloaded server) before giving up. The drivers' defaults, a minute for Redis and 30 s
  # for a database connection, would hold every request that long and use up the threads.
  data:
    redis:
      # Everything that uses Redis carries on without it, so give up quickly
      timeout: 1s
      connect-timeout: 1s
  datasource:
    hikari:
      # In milliseconds. Wait at most 3 s for a free connection, then answer 503 to retry
      connection-timeout: 3000
      # Checking that an idle connection still works gives up after 1 s
      validation-timeout: 1000
      data-source-properties:
        # In seconds: a query on a database that stopped answering fails instead of waiting
        # forever (the driver's default). Every query here takes milliseconds
        socketTimeout: 5
  jpa:
    # Flyway owns the schema; Hibernate only checks that entities match it
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          # Inventory updates touch up to a year of rows; send them in batches
          batch_size: 50
        order_updates: true

roomkeeper:
  auth:
    issuer: roomkeeper
    access-token-ttl: 15m
    refresh-token-ttl: 7d
    # jwt-secret is set per profile; prod reads it from JWT_SECRET
  # Per client IP; each bucket refills to full over its period
  rate-limits:
    login:
      capacity: 10
      period: 1m
    signup:
      capacity: 20
      period: 1h
    refresh:
      capacity: 30
      period: 1m
    # 5 a second on average, bursts of 300: a person never notices
    search:
      capacity: 300
      period: 1m
  pricing:
    occupancy:
      # 20% more once 80% of a room type is booked or held that night
      threshold: 0.80
      multiplier: 1.20
    weekend:
      nights: FRIDAY, SATURDAY
      multiplier: 1.15
    holidays:
      multiplier: 1.25
      # One calendar for every hotel for now
      dates: 2026-11-08, 2026-12-25, 2026-12-31, 2027-01-01, 2027-01-26
  booking:
    # How long unpaid rooms stay held before the expiry job releases them
    hold-duration: 10m
    # pessimistic locks a stay's nights while holding them; optimistic reads them unlocked and
    # starts over (up to optimistic-attempts times) if another hold changed them first. Kept to
    # benchmark the two: docs/locking-benchmark.md
    locking: ${BOOKING_LOCKING:pessimistic}
    optimistic-attempts: 5
    # How often the expiry job looks for holds that have run out
    expiry-interval: 1m
  inventory:
    # Hourly, at five past: each hotel's newest night opens within an hour of its midnight
    roll-cron: "0 5 * * * *"
  # Events reach their consumers through a Redis stream each; Postgres resends what Redis
  # loses (docs/outbox-streams.md)
  outbox:
    # Safety net: a commit wakes the relay at once; this catches what a wake missed
    relay-interval: 30s
    # Under spring.data.redis.timeout, or idle reads would time out (checked at startup)
    read-block: 500ms
    claim-idle: 30s
    resend-after: 2m
    max-stream-length: 10000
    live-delivery: true
  cache:
    hotel-info-ttl: 10m
    search-ttl: 60s
  payments:
    # Lowercase ISO code of a currency with two decimal places
    currency: inr
    # Where Stripe sends the guest after paying or giving up; only the webhook confirms a booking
    success-url: http://localhost:8080/payments/complete.html?session_id={CHECKOUT_SESSION_ID}
    cancel-url: http://localhost:8080/payments/cancelled.html
    stripe:
      # Test-mode keys only; without a secret key, payments answer 503 and everything else works
      secret-key: ${STRIPE_SECRET_KEY:}
      webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
  # Bodies over these are refused with 413 before anything reads them into memory
  request-size:
    max-body: 64KB
    max-webhook-body: 1MB
  idempotency:
    # A retry within a day gets the first response back
    ttl: 24h
    # How long a running request holds its key at most, so a crash can't block it for the day
    lease: 2m

management:
  # Actuator has a port of its own, which deployments keep private: Compose doesn't publish
  # it, and Prometheus scrapes it from inside the network. The public port keeps only the
  # /livez and /readyz probes.
  server:
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  metrics:
    distribution:
      # Latency buckets, so Prometheus can work out percentiles (across instances, too)
      percentiles-histogram:
        http.server.requests: true
  endpoint:
    health:
      probes:
        enabled: true
        add-additional-paths: true
      group:
        # Ready to serve while Postgres answers; Redis isn't needed, since everything that
        # uses it carries on without it
        readiness:
          include: readinessState, db
