# Everything comes from the environment, with no defaults,
# so a missing setting fails at startup instead of falling back silently.
spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD:}

roomkeeper:
  auth:
    # base64, at least 32 bytes: openssl rand -base64 32
    jwt-secret: ${JWT_SECRET}

management:
  endpoint:
    health:
      show-details: never
