# Everything comes from the environment, with no defaults,
# so a missing setting fails at startup instead of falling back silently.
spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      # Required: Redis holds idempotency records and rate-limit buckets, which anyone who
      # could reach it unauthenticated could delete
      password: ${REDIS_PASSWORD}
      # TLS, for a managed Redis that offers it
      ssl:
        enabled: ${REDIS_SSL:false}

roomkeeper:
  auth:
    # base64, at least 32 bytes: openssl rand -base64 32
    jwt-secret: ${JWT_SECRET}
  # Optional: the first admin, created at startup if missing (leave ADMIN_EMAIL unset for none)
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}

management:
  endpoint:
    health:
      show-details: never

springdoc:
  # The API's shape isn't published unless asked for: API_DOCS_ENABLED=true turns on the docs
  # and Swagger UI (Compose does, since Swagger UI is the local client)
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:false}
