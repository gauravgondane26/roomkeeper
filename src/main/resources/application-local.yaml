# Matches compose.yaml. Override ports with POSTGRES_PORT / REDIS_PORT.
spring:
  config:
    # Compose's .env (scripts/init-env.sh), for the Postgres password the containers use
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:15432}/roomkeeper
    username: roomkeeper
    password: ${POSTGRES_PASSWORD:roomkeeper}
  data:
    redis:
      host: localhost
      port: ${REDIS_PORT:16379}

roomkeeper:
  auth:
    # Development-only secret; never reuse it anywhere real
    jwt-secret: ${JWT_SECRET:VrafQC2/RfRzmNJ2WUp9ketFZXrRb41ZQn0ZXAJEyCw=}
  # Development-only admin, created at startup; approves hotels
  admin:
    email: ${ADMIN_EMAIL:admin@roomkeeper.local}
    password: ${ADMIN_PASSWORD:local-admin-password}

management:
  endpoint:
    health:
      show-details: always
