# Local development stack: `docker compose up -d`
# Host ports can be overridden with POSTGRES_PORT / REDIS_PORT.
# Postgres defaults to 5433 because 5432 is often taken by a native install.

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: roomkeeper
      POSTGRES_USER: roomkeeper
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-roomkeeper}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql/<major>/
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roomkeeper -d roomkeeper"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
