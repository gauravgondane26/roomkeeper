# Whole stack, built from source:   docker compose up -d --build --wait
# Only the services, to run the app from an IDE or `./mvnw spring-boot:run`:
#                                   docker compose up -d postgres redis
# Host ports can be overridden with APP_PORT / POSTGRES_PORT / REDIS_PORT.
# Defaults (15432, 16379) avoid clashing with native Postgres or Redis installs,
# which on Windows can bind the same port and silently take the connection.

services:
  app:
    build: .
    image: roomkeeper:local
    # Runs with the prod profile (set in the image), so this also checks the
    # production configuration: every setting comes from the environment.
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/roomkeeper
      DATABASE_USERNAME: roomkeeper
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-roomkeeper}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Same development-only secret as the local profile; set JWT_SECRET to override
      JWT_SECRET: ${JWT_SECRET:-VrafQC2/RfRzmNJ2WUp9ketFZXrRb41ZQn0ZXAJEyCw=}
      # Development-only admin, same as the local profile; approves hotels
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@roomkeeper.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-local-admin-password}
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: roomkeeper
      POSTGRES_USER: roomkeeper
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-roomkeeper}
    ports:
      - "${POSTGRES_PORT:-15432}:5432"
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql/<major>/
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roomkeeper -d roomkeeper"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - "${REDIS_PORT:-16379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
