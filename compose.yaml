# Whole stack, built from source:   docker compose up -d --build --wait
# With Prometheus and Grafana:      docker compose --profile metrics up -d --build --wait
# Only the services, to run the app from an IDE or `./mvnw spring-boot:run`:
#                                   docker compose up -d postgres redis
# Secrets come from .env (gitignored), never from defaults here: run scripts/init-env.sh once
# to create it with random values.
# Host ports can be overridden with APP_PORT / POSTGRES_PORT / REDIS_PORT. Postgres and
# Redis listen on localhost only.
# Defaults (15432, 16379) avoid clashing with native Postgres or Redis installs,
# which on Windows can bind the same port and silently take the connection.

services:
  app:
    build: .
    image: roomkeeper:local
    # Runs with the prod profile (set in the image), so this also checks the
    # production configuration: every setting comes from the environment.
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/roomkeeper
      DATABASE_USERNAME: roomkeeper
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?run scripts/init-env.sh to create .env}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # The prod profile refuses the development secret committed to the repository
      JWT_SECRET: ${JWT_SECRET:?run scripts/init-env.sh to create .env}
      # The first admin, created at startup; approves hotels
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@roomkeeper.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?run scripts/init-env.sh to create .env}
      # Swagger UI is the client locally; a real deployment leaves this unset, so docs are off
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:-true}
      # Searches a minute per client IP; raise it for a load test that searches harder
      ROOMKEEPER_RATELIMITS_SEARCH_CAPACITY: ${SEARCH_RATE_LIMIT:-300}
      # Proxies whose X-Forwarded-For is believed (an IP regex); none by default
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      # How holds keep two guests off one room: pessimistic, or optimistic for the locking
      # benchmark (loadtest/locking.js, docs/locking-benchmark.md)
      BOOKING_LOCKING: ${BOOKING_LOCKING:-pessimistic}
      # Stripe test-mode keys from your shell or .env; unset, payments answer 503 and the rest works
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    # Only the API port is published. Actuator (8081) stays on the Compose network, where
    # Prometheus scrapes it (docker compose --profile metrics up)
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Forwards Stripe test-mode webhooks to the app, to try a payment end to end:
  #   docker compose --profile stripe up -d --wait
  # It uses STRIPE_SECRET_KEY (sk_test_ only), so there's no `stripe login`. Put the
  # signing secret it prints (docker compose logs stripe) in STRIPE_WEBHOOK_SECRET.
  stripe:
    image: stripe/stripe-cli:v1.55.2
    profiles: [stripe]
    command:
      - listen
      - --forward-to
      - app:8080/webhook/payment
      - --events
      - checkout.session.completed,checkout.session.async_payment_succeeded,checkout.session.async_payment_failed,checkout.session.expired
    environment:
      STRIPE_API_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_CLI_TELEMETRY_OPTOUT: "1"
    depends_on:
      - app

  # Metrics, started with --profile metrics. Prometheus scrapes the app's management port
  # (8081, not published); Grafana shows the RoomKeeper dashboard at http://localhost:3000,
  # no login needed to view it. Both listen on localhost only.
  prometheus:
    image: prom/prometheus:v3.15.0
    profiles: [metrics]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      - app
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 10

  grafana:
    image: grafana/grafana:13.2.4
    profiles: [metrics]
    environment:
      # Anyone who can reach localhost:3000 may view; changing things needs the admin login
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?run scripts/init-env.sh to create .env}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/roomkeeper.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Load test against the running stack (see loadtest/booking.js):
  #   docker compose --profile loadtest run --rm k6
  k6:
    image: grafana/k6:2.2.0
    profiles: [loadtest]
    command: ["run", "/loadtest/booking.js"]
    volumes:
      - ./loadtest:/loadtest:ro
    environment:
      BASE_URL: http://app:8080
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@roomkeeper.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?run scripts/init-env.sh to create .env}
      K6_NO_USAGE_REPORT: "true"
    depends_on:
      - app

  # Vulnerability scan of the app image; run it through scripts/scan-image.sh, which saves
  # the image to target/ first. Its database is kept in a volume between runs.
  grype:
    image: anchore/grype:v0.121.0
    profiles: [scan]
    command: ["docker-archive:/scan/roomkeeper-image.tar", "--config", "/scan/.grype.yaml"]
    volumes:
      - ./target/roomkeeper-image.tar:/scan/roomkeeper-image.tar:ro
      - ./.grype.yaml:/scan/.grype.yaml:ro
      - grype-db:/grype-db
    environment:
      GRYPE_DB_CACHE_DIR: /grype-db
      GRYPE_CHECK_FOR_APP_UPDATE: "false"

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: roomkeeper
      POSTGRES_USER: roomkeeper
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run scripts/init-env.sh to create .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-15432}:5432"
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql/<major>/
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roomkeeper -d roomkeeper"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    # Full, Redis evicts the keys closest to expiring (cached searches, rate-limit buckets)
    # and keeps refresh tokens and idempotency keys; without a policy it would refuse writes
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "volatile-ttl"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-16379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  prometheus-data:
  grype-db:
